name: Deploy Backend

on:
  push:
    branches:
      - master
      - staging

  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy backend to production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          command_timeout: 10m
          script: |
            set -e

            cd /home/ubuntu/armenia-tourism/armenia-tourism-be

            git fetch origin
            git reset --hard origin/master

            docker compose build app queue scheduler

            if ! docker compose up -d --wait --wait-timeout 180 \
              --no-deps \
              --force-recreate \
              app queue scheduler; then
              docker compose ps
              docker compose logs --tail=200 app queue scheduler nginx
              exit 1
            fi

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan db:seed --class=Database\\Seeders\\PersianContentSeeder --force

            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache

            docker compose restart queue scheduler
            docker compose exec -T nginx nginx -s reload

            NGINX_ENDPOINT="$(docker compose port nginx 80)"
            test -n "$NGINX_ENDPOINT"
            curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              "http://${NGINX_ENDPOINT}/robots.txt" >/dev/null

            docker image prune -f

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy backend to staging
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          command_timeout: 10m
          script: |
            set -e

            cd /home/ubuntu/armenia-tourism/armenia-tourism-be

            git fetch origin
            git reset --hard origin/staging

            docker compose build app queue scheduler

            if ! docker compose up -d --wait --wait-timeout 180 \
              --no-deps \
              --force-recreate \
              app queue scheduler; then
              docker compose ps
              docker compose logs --tail=200 app queue scheduler nginx
              exit 1
            fi

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan db:seed --class=Database\\Seeders\\PersianContentSeeder --force

            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache

            docker compose restart queue scheduler
            docker compose exec -T nginx nginx -s reload

            NGINX_ENDPOINT="$(docker compose port nginx 80)"
            test -n "$NGINX_ENDPOINT"
            curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              "http://${NGINX_ENDPOINT}/robots.txt" >/dev/null

            docker image prune -f
